<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <title>Mi alfabeto</title>
</head>
<body>
  <main>
    <header class="hero">
      <p class="eyebrow">UN MUNDO DE LETRAS</p>
      <h1>Mi <span>alfabeto</span></h1>
      <p class="intro">Cada letra es el comienzo de una gran historia.</p>
    </header>

    <section class="alphabet" aria-label="Alfabeto español" id="alphabet"></section>

    <p class="footer-note">¡Elige una letra y descubre su palabra!</p>
  </main>

  <script>
    const letters = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("");
    const alphabet = document.querySelector("#alphabet");

    alphabet.innerHTML = letters.map((letter, index) => `
      <button class="letter-card" type="button" aria-label="Letra ${letter}">
        <span class="letter">${letter}</span>
        <span class="number">${String(index + 1).padStart(2, "0")}</span>
      </button>
    `).join("");
  </script>
</body>
</html>
